<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFL Turnuva Ağacı</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(30, 30, 30, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --gold: #f1c40f;
            --gold-glow: rgba(241, 196, 15, 0.3);
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, #2b2b2b 0%, var(--bg-color) 70%);
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }

        .tournament-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
        }

        .round-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            min-width: 280px;
            align-items: center;
        }

        .round-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .match-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .match-label {
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-left: 4px;
            text-transform: uppercase;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .match-card:hover {
            border-color: rgba(241, 196, 15, 0.4);
            transform: translateY(-2px);
        }

        .match-card.final-card {
            border: 1px solid var(--gold);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .match-header {
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .team-row:not(:last-child) {
            border-bottom: 1px solid var(--border-color);
        }

        .team-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-score {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 600;
            min-width: 32px;
            text-align: center;
            font-size: 0.9rem;
        }

        .team-score.has-score {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(241, 196, 15, 0.08);
        }

        .match-footer-referee {
            background: rgba(0, 0, 0, 0.35);
            border-top: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
        }

        .match-footer-referee span {
            color: var(--text-main);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>IFL TURNUVA AĞACI</h1>

    <div class="tournament-container" id="tournamentTree">
        <!-- Tablo yüklenirken boş kalmaması için varsayılan tasarım gösterilir -->
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyysbbG9AHwcw_Z-3_PVLqkrXldyF80ui_emfRSnIsCkkrmS-XIsWYdWJ09hXPZpWs8/exec';

        // Sayfa açılır açılmaz ekranda görünecek varsayılan veriler (Hakemler eklendi)
        let m_data = {
            'QF1': { takim1: '11-B', takim2: '12/A', skor: '9-2', tarih: '20.10.2026', hakem: 'Mehmet Doğan' },
            'QF2': { takim1: '10-A', takim2: '10-B', skor: '1-0', tarih: '22.10.2026', hakem: 'Fatih Teper' },
            'QF3': { takim1: '11/A', takim2: '12-B', skor: '-', tarih: '27.10.2026', hakem: 'Mehmet Doğan' },
            'QF4': { takim1: '9/A', takim2: '9/B', skor: '-', tarih: '03.11.2026', hakem: 'Mehmet Doğan' },
            'SF1': { takim1: '11/B (1. Çeyrek Final Galibi)', takim2: '10/A (2. Çeyrek Final Galibi)', skor: '-', tarih: '10.11.2026', hakem: 'Mehmet Doğan' },
            'SF2': { takim1: '- (3. Çeyrek Final Galibi)', takim2: '- (4. Çeyrek Final Galibi)', skor: '-', tarih: '12.11.2026', hakem: 'Fatih Teper' },
            'FINAL': { takim1: '1. Yarı Final Galibi', takim2: '2. Yarı Final Galibi', skor: '-', tarih: '17.11.2026', hakem: 'Fatih Teper' }
        };

        function parseScore(skorStr, teamIndex) {
            if (!skorStr || skorStr === '-' || skorStr === undefined) return '-';
            const parts = String(skorStr).split('-');
            if (parts.length === 2) {
                return parts[teamIndex].trim();
            }
            return '-';
        }

        function createMatchHTML(code, labelText, isFinal = false) {
            const data = m_data[code] || { takim1: '-', takim2: '-', skor: '-', tarih: '-', hakem: '-' };
            const s1 = parseScore(data.skor, 0);
            const s2 = parseScore(data.skor, 1);
            
            const s1Class = s1 !== '-' ? 'team-score has-score' : 'team-score';
            const s2Class = s2 !== '-' ? 'team-score has-score' : 'team-score';
            const refereeName = data.hakem && data.hakem !== '-' ? data.hakem : 'Atanmadı';

            return `
                <div class="match-wrapper">
                    <div class="match-label">${labelText}</div>
                    <div class="match-card ${isFinal ? 'final-card' : ''}">
                        <div class="match-header">${data.tarih || code}</div>
                        <div class="team-row">
                            <span class="team-name">${data.takim1 || '-'}</span>
                            <span class="${s1Class}">${s1}</span>
                        </div>
                        <div class="team-row">
                            <span class="team-name">${data.takim2 || '-'}</span>
                            <span class="${s2Class}">${s2}</span>
                        </div>
                        <div class="match-footer-referee">
                            Hakem: <span>${refereeName}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTree() {
            const html = `
                <!-- ÇEYREK FİNAL -->
                <div class="round-column">
                    <div class="round-title">Çeyrek Final</div>
                    ${createMatchHTML('QF1', '1. Çeyrek Final')}
                    ${createMatchHTML('QF2', '2. Çeyrek Final')}
                    ${createMatchHTML('QF3', '3. Çeyrek Final')}
                    ${createMatchHTML('QF4', '4. Çeyrek Final')}
                </div>

                <!-- YARI FİNAL -->
                <div class="round-column" style="justify-content: center;">
                    <div class="round-title">Yarı Final</div>
                    <div style="width: 100%; display: flex; flex-direction: column; gap: 30px; margin-top: 20px;">
                        ${createMatchHTML('SF1', '1. Yarı Final')}
                        ${createMatchHTML('SF2', '2. Yarı Final')}
                    </div>
                </div>

                <!-- FİNAL -->
                <div class="round-column" style="justify-content: center;">
                    <div class="round-title">Final</div>
                    <div style="margin-top: 20px; width: 100%;">
                        ${createMatchHTML('FINAL', 'Büyük Final', true)}
                    </div>
                </div>
            `;

            document.getElementById('tournamentTree').innerHTML = html;
        }

        // JSONP Yöntemi ile Google E-Tablolar'dan Veri Çekme
        window.handleGoogleSheetData = function(rows) {
            if (Array.isArray(rows)) {
                rows.forEach(row => {
                    if (row.kod) {
                        const kod = String(row.kod).trim().toUpperCase();
                        m_data[kod] = {
                            tur: row.tur || '',
                            tarih: row.tarih || '',
                            takim1: row.takim1 || '-',
                            takim2: row.takim2 || '-',
                            skor: row.skor || '-',
                            hakem: row.hakem || '-'
                        };
                    }
                });
                renderTree();
            }
        };

        function fetchLiveSheetData() {
            const oldScript = document.getElementById('jsonp-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-script';
            script.src = API_URL + '?callback=handleGoogleSheetData&t=' + new Date().getTime();
            document.body.appendChild(script);
        }

        // İlk ekran oluşturması
        renderTree();

        // Canlı verileri çek
        fetchLiveSheetData();

        // Her 10 saniyede bir Google E-Tablo'yu kontrol et
        setInterval(fetchLiveSheetData, 10000);
    </script>
</body>
</html>
