<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFL Turnuva Ağacı</title>
  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #111;
      color: #eaeaea;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 30px;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Ağaç Şeması Konteyneri */
    .bracket-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
      padding: 20px;
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 25px;
    }

    .round-title {
      font-size: 13px;
      font-weight: bold;
      color: #888;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Maç Kutusu */
    .match-box {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      width: 210px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .match-box:hover {
      transform: translateY(-2px);
      border-color: #555;
    }

    /* Maç Tarihi / Bilgisi */
    .match-date {
      background: #222;
      color: #aaa;
      font-size: 10px;
      padding: 4px;
      border-bottom: 1px solid #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Takım Satırı */
    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 10px;
      border-bottom: 1px solid #282828;
      font-size: 13px;
      font-weight: bold;
    }

    .team-row:last-child {
      border-bottom: none;
    }

    .team-name {
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
      text-align: left;
    }

    /* Skor Kutusu (Sarı) */
    .score {
      color: #ffcc00;
      font-weight: bold;
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      min-width: 20px;
      text-align: center;
    }

    /* Final Şampiyon Kutusu Vurgusu */
    .champion-box {
      border: 1px solid #ffcc00;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
    }

    @media (max-width: 768px) {
      .bracket-container {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <h1>İFL TURNUVA AĞACI</h1>

  <div class="bracket-container" id="bracket">
    
    <!-- 1. SÜTUN: ÇEYREK FİNAL -->
    <div class="round">
      <div class="round-title">Çeyrek Final</div>
      
      <div class="match-box" id="match-QF1">
        <div class="match-date">-</div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
      </div>

      <div class="match-box" id="match-QF2">
        <div class="match-date">-</div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
      </div>

      <div class="match-box" id="match-QF3">
        <div class="match-date">-</div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
      </div>

      <div class="match-box" id="match-QF4">
        <div class="match-date">-</div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
      </div>
    </div>

    <!-- 2. SÜTUN: YARI FİNAL -->
    <div class="round">
      <div class="round-title">Yarı Final</div>

      <div class="match-box" id="match-SF1">
        <div class="match-date">-</div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
      </div>

      <div class="match-box" id="match-SF2">
        <div class="match-date">-</div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
      </div>
    </div>

    <!-- 3. SÜTUN: FİNAL -->
    <div class="round">
      <div class="round-title">Final</div>

      <div class="match-box champion-box" id="match-FINAL">
        <div class="match-date">-</div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
        <div class="team-row"><span class="team-name">-</span><span class="score">-</span></div>
      </div>
    </div>

  </div>

  <script>
    const sheetId = "1fGN9FyOXlcNF8YxE-fvcDrAUqaf0sFSI3EYUIgnZP0";
    const tournamentRange = "TURNUVA!A2:F8";

    function loadBracketData() {
      const script = document.createElement('script');
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:handleBracket&range=${encodeURIComponent(tournamentRange)}`;
      document.body.appendChild(script);
    }

    window.handleBracket = function(data) {
      console.log("Google Sheets Verisi Geldi:", data); // F12 konsolundan kontrol için
      const rows = data.table.rows;

      rows.forEach(r => {
        if (!r.c || !r.c[0] || !r.c[0].v) return;

        const matchCode = r.c[0].v.toString().trim(); 
        const dateStr = r.c[2] && r.c[2].v ? r.c[2].v.toString() : "-";
        const team1 = r.c[3] && r.c[3].v ? r.c[3].v.toString() : "-";
        const team2 = r.c[4] && r.c[4].v ? r.c[4].v.toString() : "-";
        const rawScore = r.c[5] && r.c[5].v ? r.c[5].v.toString() : "-";

        let score1 = "-";
        let score2 = "-";

        if (rawScore.includes("-")) {
          const parts = rawScore.split("-");
          score1 = parts[0].trim();
          score2 = parts[1].trim();
        } else if (rawScore !== "-") {
          score1 = rawScore;
        }

        const matchElem = document.getElementById(`match-${matchCode}`);
        if (matchElem) {
          const dateElem = matchElem.querySelector('.match-date');
          if (dateElem) dateElem.textContent = dateStr;
          
          const rowsElem = matchElem.querySelectorAll('.team-row');
          if (rowsElem.length === 2) {
            rowsElem[0].querySelector('.team-name').textContent = team1;
            rowsElem[0].querySelector('.score').textContent = score1;

            rowsExpr = rowsElem[1].querySelector('.team-name');
            if(rowsExpr) rowsExpr.textContent = team2;
            rowsElem[1].querySelector('.score').textContent = score2;
          }
        }
      });
    };

    loadBracketData();
    setInterval(loadBracketData, 60000);
  </script>

</body>
</html>
