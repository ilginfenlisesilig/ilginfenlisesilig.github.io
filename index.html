<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFL Turnuva Ağacı</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(30, 30, 30, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --gold: #f1c40f;
            --gold-glow: rgba(241, 196, 15, 0.3);
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, #2b2b2b 0%, var(--bg-color) 70%);
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }

        .tournament-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
        }

        .round-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            min-width: 280px;
            align-items: center;
        }

        .round-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .match-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .match-label {
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-left: 4px;
            text-transform: uppercase;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .match-card:hover {
            border-color: rgba(241, 196, 15, 0.4);
            transform: translateY(-2px);
        }

        .match-card.final-card {
            border: 1px solid var(--gold);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .match-header {
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .team-row.winner-row {
            background: rgba(241, 196, 15, 0.08);
            font-weight: 600;
        }

        .team-row:not(:last-child) {
            border-bottom: 1px solid var(--border-color);
        }

        .team-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .winner-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--gold);
            border: 1px solid rgba(241, 196, 15, 0.45);
            background: rgba(241, 196, 15, 0.12);
            padding: 1px 5px;
            border-radius: 4px;
            letter-spacing: 0.4px;
        }

        .score-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pen-score {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--gold);
            background: rgba(241, 196, 15, 0.14);
            border: 1px solid rgba(241, 196, 15, 0.35);
            padding: 2px 6px;
            border-radius: 5px;
        }

        .team-score {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 600;
            min-width: 32px;
            text-align: center;
            font-size: 0.9rem;
        }

        .team-score.has-score {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(241, 196, 15, 0.08);
        }

        .penalty-note {
            background: rgba(241, 196, 15, 0.07);
            border-top: 1px solid rgba(241, 196, 15, 0.22);
            padding: 5px 12px;
            font-size: 0.74rem;
            color: var(--gold);
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .match-footer-referee {
            background: rgba(0, 0, 0, 0.35);
            border-top: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
        }

        .match-footer-referee span {
            color: var(--text-main);
            font-weight: 500;
        }
    </style>
</head>
