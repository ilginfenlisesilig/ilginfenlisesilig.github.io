<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFL Futbol Turnuva Ağacı</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: rgba(24, 24, 24, 0.9);
            --border-color: rgba(255, 255, 255, 0.12);
            --gold: #ff6a00;
            --gold-glow: rgba(255, 106, 0, 0.35);
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 106, 0, 0.14) 0%, var(--bg-color) 65%);
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 106, 0, 0.25);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }

        .tournament-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
        }

        .round-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            min-width: 280px;
            align-items: center;
        }

        .round-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .match-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .match-label {
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-left: 4px;
            text-transform: uppercase;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .match-card:hover {
            border-color: rgba(255, 106, 0, 0.45);
            transform: translateY(-2px);
        }

        .match-card.final-card {
            border: 1px solid var(--gold);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .match-header {
            background: rgba(0, 0, 0, 0.28);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .team-row.winner-row {
            background: rgba(255, 106, 0, 0.11);
            font-weight: 600;
        }

        .team-row:not(:last-child) {
            border-bottom: 1px solid var(--border-color);
        }

        .team-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .winner-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: #ff8529;
            border: 1px solid rgba(255, 106, 0, 0.5);
            background: rgba(255, 106, 0, 0.14);
            padding: 1px 5px;
            border-radius: 4px;
            letter-spacing: 0.4px;
        }

        .score-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pen-score {
            font-size: 0.78rem;
            font-weight: 700;
            color: #ff8529;
            background: rgba(255, 106, 0, 0.16);
            border: 1px solid rgba(255, 106, 0, 0.4);
            padding: 2px 6px;
            border-radius: 5px;
        }

        .team-score {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 600;
            min-width: 32px;
            text-align: center;
            font-size: 0.9rem;
        }

        .team-score.has-score {
            border-color: var(--gold);
            color: #ff8529;
            background: rgba(255, 106, 0, 0.1);
        }

        .penalty-note {
            background: rgba(255, 106, 0, 0.09);
            border-top: 1px solid rgba(255, 106, 0, 0.25);
            padding: 5px 12px;
            font-size: 0.74rem;
            color: #ff8529;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .match-footer-referee {
            background: rgba(0, 0, 0, 0.35);
            border-top: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
        }

        .match-footer-referee span {
            color: var(--text-main);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>IFL FUTBOL TURNUVA AĞACI</h1>

    <div class="tournament-container" id="tournamentTree"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyysbbG9AHwcw_Z-3_PVLqkrXldyF80ui_emfRSnIsCkkrmS-XIsWYdWJ09hXPZpWs8/exec';

        let m_data = {
            'QF1': { takim1: '11-B', takim2: '12/A', skor: '9-2', penalti: '', tarih: '20.10.2026', hakem: 'Mehmet Doğan' },
            'QF2': { takim1: '10-A', takim2: '10-B', skor: '1-0', penalti: '', tarih: '22.10.2026', hakem: 'Fatih Teper' },
            'QF3': { takim1: '11/A', takim2: '12-B', skor: '5-2', penalti: '', tarih: '27.10.2026', hakem: 'Mehmet Doğan' },
            'QF4': { takim1: '9/A', takim2: '9/B', skor: '6-0', penalti: '', tarih: '03.11.2026', hakem: 'Mehmet Doğan' },
            'SF1': { takim1: '10/A', takim2: '11/B', skor: '2-2', penalti: '4-2', tarih: '5.11.2026', hakem: 'Mehmet Doğan' },
            'SF2': { takim1: '9/A', takim2: '11/A', skor: '4-1', penalti: '', tarih: '10.11.2026', hakem: 'Mehmet Doğan' },
            'FINAL': { takim1: '10/A', takim2: '9/A', skor: '4-2', penalti: '', tarih: '12.11.2026', hakem: 'Fatih Teper' }
        };

        function parsePair(pairStr, index) {
            try {
                if (!pairStr || pairStr === '-') return '-';
                const parts = String(pairStr).split('-');
                if (parts.length >= 2) {
                    const val = parts[index].trim();
                    return val !== '' ? val : '-';
                }
            } catch (e) {}
            return '-';
        }

        function createMatchHTML(code, labelText, isFinal = false) {
            const data = m_data[code] || { takim1: '-', takim2: '-', skor: '-', penalti: '', tarih: '-', hakem: '-' };
            const s1 = parsePair(data.skor, 0);
            const s2 = parsePair(data.skor, 1);

            const p1 = parsePair(data.penalti, 0);
            const p2 = parsePair(data.penalti, 1);
            const hasPenalties = p1 !== '-' && p2 !== '-';

            const s1Class = s1 !== '-' ? 'team-score has-score' : 'team-score';
            const s2Class = s2 !== '-' ? 'team-score has-score' : 'team-score';
            const refereeName = data.hakem && data.hakem !== '-' ? data.hakem : 'Atanmadı';

            const numS1 = Number(s1);
            const numS2 = Number(s2);
            const hasValidScores = s1 !== '-' && s2 !== '-' && !Number.isNaN(numS1) && !Number.isNaN(numS2);

            let team1Wins = false;
            let team2Wins = false;
            let wonByPenalties = false;

            if (hasValidScores) {
                if (numS1 > numS2) {
                    team1Wins = true;
                } else if (numS2 > numS1) {
                    team2Wins = true;
                } else if (numS1 === numS2 && hasPenalties) {
                    const numP1 = Number(p1);
                    const numP2 = Number(p2);
                    if (!Number.isNaN(numP1) && !Number.isNaN(numP2) && numP1 !== numP2) {
                        team1Wins = numP1 > numP2;
                        team2Wins = numP2 > numP1;
                        wonByPenalties = true;
                    }
                }
            }

            let penaltyNoteHTML = '';
            if (hasPenalties) {
                const winnerTeam = wonByPenalties ? (team1Wins ? data.takim1 : data.takim2) : '';
                penaltyNoteHTML = wonByPenalties
                    ? `<div class="penalty-note">Penaltılarla ${winnerTeam} kazandı (${p1}-${p2})</div>`
                    : `<div class="penalty-note">Penaltılar: ${p1}-${p2}</div>`;
            }

            const pen1Badge = hasPenalties ? `<span class="pen-score">(${p1}P)</span>` : '';
            const pen2Badge = hasPenalties ? `<span class="pen-score">(${p2}P)</span>` : '';

            const badgeLabel = isFinal ? 'ŞAMPİYON' : 'TUR';
            const win1Badge = team1Wins ? `<span class="winner-badge">${badgeLabel}</span>` : '';
            const win2Badge = team2Wins ? `<span class="winner-badge">${badgeLabel}</span>` : '';

            return `
                <div class="match-wrapper">
                    <div class="match-label">${labelText}</div>
                    <div class="match-card ${isFinal ? 'final-card' : ''}">
                        <div class="match-header">${data.tarih || code}</div>
                        <div class="team-row ${team1Wins ? 'winner-row' : ''}">
                            <span class="team-name">${data.takim1 || '-'} ${win1Badge}</span>
                            <span class="score-group">
                                ${pen1Badge}
                                <span class="${s1Class}">${s1}</span>
                            </span>
                        </div>
                        <div class="team-row ${team2Wins ? 'winner-row' : ''}">
                            <span class="team-name">${data.takim2 || '-'} ${win2Badge}</span>
                            <span class="score-group">
                                ${pen2Badge}
                                <span class="${s2Class}">${s2}</span>
                            </span>
                        </div>
                        ${penaltyNoteHTML}
                        <div class="match-footer-referee">
                            Hakem: <span>${refereeName}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTree() {
            try {
                const container = document.getElementById('tournamentTree');
                if (!container) return;

                container.innerHTML = `
                    <div class="round-column">
                        <div class="round-title">Çeyrek Finaller</div>
                        ${createMatchHTML('QF1', '1. Çeyrek Final')}
                        ${createMatchHTML('QF2', '2. Çeyrek Final')}
                        ${createMatchHTML('QF3', '3. Çeyrek Final')}
                        ${createMatchHTML('QF4', '4. Çeyrek Final')}
                    </div>

                    <div class="round-column" style="justify-content: center;">
                        <div class="round-title">Yarı Finaller</div>
                        <div style="width: 100%; display: flex; flex-direction: column; gap: 30px; margin-top: 20px;">
                            ${createMatchHTML('SF1', '1. Yarı Final')}
                            ${createMatchHTML('SF2', '2. Yarı Final')}
                        </div>
                    </div>

                    <div class="round-column" style="justify-content: center;">
                        <div class="round-title">Final</div>
                        <div style="margin-top: 20px; width: 100%;">
                            ${createMatchHTML('FINAL', 'Büyük Final', true)}
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error('Render hatası:', err);
            }
        }

        window.handleGoogleSheetData = function(rows) {
            try {
                if (!Array.isArray(rows)) return;
                rows.forEach(row => {
                    if (!row || !row.kod) return;
                    const kod = String(row.kod).trim().toUpperCase();
                    const mevcut = m_data[kod] || {};

                    const penaltiVal = row.penalti !== undefined && row.penalti !== null && String(row.penalti).trim() !== ''
                        ? String(row.penalti).trim()
                        : (row.penalti1 !== undefined && row.penalti2 !== undefined
                            ? `${row.penalti1}-${row.penalti2}`
                            : (mevcut.penalti || ''));

                    m_data[kod] = {
                        tur: row.tur || mevcut.tur || '',
                        tarih: row.tarih || mevcut.tarih || '',
                        takim1: row.takim1 || mevcut.takim1 || '-',
                        takim2: row.takim2 || mevcut.takim2 || '-',
                        skor: row.skor || mevcut.skor || '-',
                        penalti: penaltiVal,
                        hakem: row.hakem || mevcut.hakem || '-'
                    };
                });
                renderTree();
            } catch (err) {
                console.error('Sheet veri hatası:', err);
            }
        };

        function fetchLiveSheetData() {
            try {
                const oldScript = document.getElementById('jsonp-script');
                if (oldScript) oldScript.remove();

                const script = document.createElement('script');
                script.id = 'jsonp-script';
                script.src = API_URL + '?callback=handleGoogleSheetData&t=' + Date.now();
                script.onerror = function() {};
                document.body.appendChild(script);
            } catch (err) {}
        }

        renderTree();
        fetchLiveSheetData();
        setInterval(fetchLiveSheetData, 10000);
    </script>
</body>
</html>
