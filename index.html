<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFL Turnuva Ağacı</title>
    <style>
        :root {
            --bg-color: #121316;
            --card-bg: #1c1e22;
            --card-header-bg: #25282e;
            --border-color: #2d3139;
            --orange: #ff7700;
            --orange-glow: rgba(255, 119, 0, 0.25);
            --yellow: #ffb703;
            --text-main: #f1f3f5;
            --text-muted: #9aa0a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, #1e2026 0%, var(--bg-color) 75%);
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 119, 0, 0.2);
            border-bottom: 3px solid var(--orange);
            padding-bottom: 10px;
            color: #ffffff;
        }

        .tournament-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
        }

        .round-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            min-width: 260px;
            align-items: center;
        }

        .round-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--orange);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .match-card:hover {
            border-color: var(--orange);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(255, 119, 0, 0.15);
        }

        .match-card.final-card {
            border: 2px solid var(--orange);
            box-shadow: 0 0 25px var(--orange-glow);
            background: linear-gradient(145deg, #22252b, #1a1c21);
        }

        .match-header {
            background: var(--card-header-bg);
            padding: 6px 12px;
            font-size: 0.8rem;
            color: var(--yellow);
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }
