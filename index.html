<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İFL Turnuva Ağacı</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --gold: #f39c12;
            --gold-glow: rgba(243, 156, 18, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, #1a233a 0%, var(--bg-color) 70%);
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }

        .tournament-container {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: center;
            max-width: 1300px;
            width: 100%;
            flex-wrap: wrap;
        }

        .round-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex: 1;
            min-width: 280px;
            align-items: center;
        }

        .round-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .match-card:hover {
            border-color: rgba(243, 156, 18, 0.4);
            transform: translateY(-2px);
        }

        .match-card.final-card {
            border: 1px solid var(--gold);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .match-header {
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .team-row:not(:last-child) {
            border-bottom: 1px solid var(--border-color);
        }

        .team-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-score {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 600;
            min-width: 32px;
            text-align: center;
            font-size: 0.9rem;
        }

        .team-score.has-score {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(243, 156, 18, 0.08);
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>
